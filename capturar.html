<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Enviar Comprovante | ICNV Rocha Miranda</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --navy: #0f172a;
  --slate: #475569;
  --muted: #64748b;
  --border: #e2e8f0;
  --bg: #f7f8fa;
  --white: #ffffff;
  --entrada: #16803d;
  --entrada2: #dcfce7;
  --saida: #c0272d;
  --saida2: #fbe4e4;
  --accent: #4338ca;
  --accent2: #eceefb;
  --r: 10px;
  --r-sm: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--navy);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  background: var(--navy);
  padding: 18px 20px;
  color: #fff;
}
.topbar-title { font-size: 16px; font-weight: 700; }
.topbar-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 2px; }

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 40px;
}

.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  margin-bottom: 16px;
}

.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 11px; font-weight: 600; color: var(--slate);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
}
.form-input, .form-select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 15px; color: var(--navy);
  background: var(--white);
  font-family: inherit;
}
.form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }

/* Área de captura */
.captura-area {
  border: 2px dashed var(--border);
  border-radius: var(--r);
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  display: block;
}
.captura-area:active { border-color: var(--accent); background: var(--accent2); }
.captura-icon { font-size: 40px; margin-bottom: 10px; display: block; }
.captura-texto { font-size: 14px; color: var(--slate); font-weight: 600; }
.captura-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

.preview-wrap { position: relative; margin-bottom: 16px; }
.preview-img {
  width: 100%; max-height: 340px; object-fit: contain;
  border-radius: var(--r); border: 1px solid var(--border);
  background: #000;
}
.preview-trocar {
  display: block; text-align: center; margin-top: 10px;
  font-size: 13px; color: var(--accent); font-weight: 600;
  text-decoration: none; cursor: pointer;
}

/* Fila de arquivos (captura em lote) */
.fila-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 14px 0;
}
.fila-item {
  position: relative; aspect-ratio: 1; border-radius: var(--r-sm);
  overflow: hidden; border: 1.5px solid var(--border); background: var(--bg);
}
.fila-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fila-item .fila-pdf {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-size: 28px; background: var(--bg);
}
.fila-remover {
  position: absolute; top: 3px; right: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(15,23,42,.75); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: pointer; border: none;
}
.fila-status {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 3px 4px; font-size: 10px; font-weight: 700; text-align: center;
  color: #fff;
}
.fila-status.enviando { background: rgba(67,56,202,.85); }
.fila-status.enviado  { background: rgba(22,128,61,.9); }
.fila-status.erro     { background: rgba(192,39,45,.9); }

.btn-enviar {
  width: 100%; padding: 14px;
  background: var(--accent); border: none; border-radius: var(--r-sm);
  font-size: 15px; font-weight: 700; color: #fff;
  cursor: pointer; font-family: inherit;
}
.btn-enviar:disabled { opacity: .5; cursor: not-allowed; }

.status-msg {
  margin-top: 14px; padding: 12px 14px;
  border-radius: var(--r-sm); font-size: 13px;
  display: none; text-align: center; font-weight: 600;
}
.status-msg.sucesso { display: block; background: var(--entrada2); color: var(--entrada); }
.status-msg.erro    { display: block; background: var(--saida2); color: var(--saida); }
.status-msg.carregando { display: block; background: var(--accent2); color: var(--accent); }

.hist-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.hist-item:last-child { border-bottom: none; }
.hist-nome { color: var(--slate); }
.hist-ok { color: var(--entrada); font-weight: 600; }

input[type="file"] { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <p class="topbar-title">📸 Enviar Comprovante</p>
  <p class="topbar-sub">ICNV Rocha Miranda · Tire a foto e envie para revisão</p>
</div>

<div class="container">

  <div class="card">
    <div class="form-group">
      <label class="form-label">Mês da despesa</label>
      <select class="form-select" id="mesSelect"></select>
      <p style="font-size:11px;color:var(--muted);margin-top:5px">🤖 O mês é detectado automaticamente pela data do comprovante. Só use esse campo se a leitura falhar.</p>
    </div>

    <div class="form-group">
      <label class="form-label">Seu nome (opcional)</label>
      <input class="form-input" id="enviadoPor" placeholder="Quem está enviando?" autocomplete="off">
    </div>

    <div id="areaSemFoto">
      <label class="captura-area" for="fileInput">
        <span class="captura-icon">📷</span>
        <span class="captura-texto">Tocar para tirar fotos ou escolher da galeria</span>
        <span class="captura-sub">Pode selecionar várias notas de uma vez</span>
      </label>
      <input type="file" id="fileInput" accept="image/*,.pdf" multiple onchange="arquivosSelecionados(this)">
    </div>

    <div id="filaGrid" class="fila-grid"></div>
    <a class="preview-trocar" id="linkAdicionarMais" style="display:none" onclick="document.getElementById('fileInput').click()">+ Adicionar mais arquivos</a>

    <button class="btn-enviar" id="btnEnviar" onclick="enviarFila()" disabled style="margin-top:16px">
      Enviar para revisão
    </button>

    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="card" id="historicoCard" style="display:none">
    <p style="font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Enviados nesta sessão</p>
    <div id="historicoLista"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════
// CONFIGURAÇÃO — mesma URL do Apps Script de Comprovantes já usado no dashboard
// ═══════════════════════════════════════
const URL_COMPROV = "https://script.google.com/macros/s/AKfycbw4vb9wleU09tTSlzKNh6m31uU9dBJTu6vjXufDqg9-_AM__HdiR4rP7mgznpnQZW8qHg/exec";
const MESES = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO",
               "JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

let filaArquivos = []; // [{ base64, mimeType, nomeArquivo, previewUrl, ehPdf, status }]

// ── Inicialização ──
(function init(){
  const sel = document.getElementById("mesSelect");
  const optAuto = document.createElement("option");
  optAuto.value = ""; optAuto.textContent = "🤖 Detectar automaticamente (recomendado)";
  optAuto.selected = true;
  sel.appendChild(optAuto);
  MESES.forEach(function(m){
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });

  // Lembrar o nome de quem envia (conveniência, guardado só neste navegador)
  const nomeSalvo = localStorage.getItem("nv_enviado_por");
  if(nomeSalvo) document.getElementById("enviadoPor").value = nomeSalvo;
})();

// ── Seleção de um ou vários arquivos (câmera ou galeria) ──
function arquivosSelecionados(input){
  const arquivos = Array.from(input.files || []);
  if(arquivos.length === 0) return;

  arquivos.forEach(function(file){
    const ehPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
    const item = { base64: null, mimeType: null, nomeArquivo: null, previewUrl: null, ehPdf: ehPdf, status: "pendente" };
    filaArquivos.push(item);
    const idx = filaArquivos.length - 1;

    if(ehPdf){
      const reader = new FileReader();
      reader.onload = function(e){
        item.base64 = e.target.result.split(",")[1];
        item.mimeType = "application/pdf";
        item.nomeArquivo = nomeUnico("pdf");
        renderFilaGrid();
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          // Comprimir: redimensionar para no máximo 1600px no lado maior, qualidade 0.75
          const MAX_LADO = 1600;
          let largura = img.width, altura = img.height;
          if(largura > MAX_LADO || altura > MAX_LADO){
            if(largura > altura){ altura = Math.round(altura * (MAX_LADO/largura)); largura = MAX_LADO; }
            else { largura = Math.round(largura * (MAX_LADO/altura)); altura = MAX_LADO; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = largura; canvas.height = altura;
          canvas.getContext("2d").drawImage(img, 0, 0, largura, altura);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.75);

          item.base64 = dataUrl.split(",")[1];
          item.mimeType = "image/jpeg";
          item.nomeArquivo = nomeUnico("jpg");
          item.previewUrl = dataUrl;
          renderFilaGrid();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  input.value = ""; // permite selecionar o mesmo arquivo de novo depois, se precisar
  renderFilaGrid(); // mostra os itens já na fila (ainda processando) de imediato
}

function nomeUnico(ext){
  return "Comprovante-" + new Date().toISOString().slice(0,19).replace(/[:T]/g,"-") + "-" + Math.random().toString(36).slice(2,6) + "." + ext;
}

function removerDaFila(idx){
  filaArquivos.splice(idx, 1);
  renderFilaGrid();
}

function renderFilaGrid(){
  const grid = document.getElementById("filaGrid");
  const linkMais = document.getElementById("linkAdicionarMais");
  const btn = document.getElementById("btnEnviar");

  grid.innerHTML = "";
  filaArquivos.forEach(function(item, idx){
    const div = document.createElement("div");
    div.className = "fila-item";
    const conteudoPreview = item.ehPdf
      ? '<div class="fila-pdf">📄</div>'
      : (item.previewUrl ? '<img src="'+item.previewUrl+'">' : '<div class="fila-pdf">⏳</div>');
    const statusBadge = item.status === "pendente" ? ""
      : '<div class="fila-status ' + item.status + '">' + (item.status === "enviando" ? "Enviando..." : item.status === "enviado" ? "✓ Enviado" : "✕ Erro") + '</div>';
    const podeRemover = item.status === "pendente" || item.status === "erro";
    div.innerHTML = conteudoPreview + statusBadge +
      (podeRemover ? '<button class="fila-remover" onclick="removerDaFila(' + idx + ')">✕</button>' : "");
    grid.appendChild(div);
  });

  const pendentes = filaArquivos.filter(function(i){ return i.status === "pendente" && i.base64; }).length;
  linkMais.style.display = filaArquivos.length > 0 ? "block" : "none";
  btn.disabled = pendentes === 0;
  btn.textContent = pendentes > 0 ? "Enviar " + pendentes + " comprovante" + (pendentes>1?"s":"") + " para revisão" : "Enviar para revisão";
}

function mostrarStatus(msg, tipo){
  const el = document.getElementById("statusMsg");
  el.textContent = msg;
  el.className = "status-msg " + tipo;
}
function esconderStatus(){
  document.getElementById("statusMsg").className = "status-msg";
}

// ── Envio — processa a fila um por um (o Apps Script já serializa as
// requisições internamente, então enviar em sequência é o mais seguro) ──
async function enviarFila(){
  const mes = document.getElementById("mesSelect").value;
  const enviadoPor = document.getElementById("enviadoPor").value.trim();
  if(enviadoPor) localStorage.setItem("nv_enviado_por", enviadoPor);

  const btn = document.getElementById("btnEnviar");
  btn.disabled = true;

  const pendentes = filaArquivos.filter(function(i){ return i.status === "pendente" && i.base64; });
  let sucesso = 0, falhas = 0;

  for(let i = 0; i < pendentes.length; i++){
    const item = pendentes[i];
    item.status = "enviando";
    renderFilaGrid();
    mostrarStatus("📤 Enviando " + (i+1) + " de " + pendentes.length + "...", "carregando");

    try{
      const res = await fetch(URL_COMPROV, {
        method: "POST",
        body: JSON.stringify({
          acao: "enviar_para_revisao",
          mes: mes,
          imagemBase64: item.base64,
          mimeType: item.mimeType,
          nomeArquivo: item.nomeArquivo,
          enviadoPor: enviadoPor || "—",
        }),
      });
      const json = await res.json();
      if(json.ok){
        item.status = "enviado";
        sucesso++;
        adicionarAoHistorico(item.nomeArquivo, json.mesDetectado || mes || "?");
      } else {
        item.status = "erro";
        falhas++;
      }
    }catch(e){
      item.status = "erro";
      falhas++;
    }
    renderFilaGrid();
  }

  if(falhas === 0){
    mostrarStatus("✅ " + sucesso + " comprovante(s) enviado(s) com sucesso!", "sucesso");
  } else {
    mostrarStatus("⚠️ " + sucesso + " enviado(s), " + falhas + " com erro (toque em ✕ para remover e tentar de novo).", "erro");
  }

  // Remove da fila os que deram certo, deixando só os com erro (pra tentar de novo se quiser)
  filaArquivos = filaArquivos.filter(function(i){ return i.status !== "enviado"; });
  renderFilaGrid();
}

function adicionarAoHistorico(nome, mes){
  const card = document.getElementById("historicoCard");
  const lista = document.getElementById("historicoLista");
  card.style.display = "block";
  const item = document.createElement("div");
  item.className = "hist-item";
  item.innerHTML = `<span class="hist-nome">${nome} · ${mes}</span><span class="hist-ok">✓ enviado</span>`;
  lista.insertBefore(item, lista.firstChild);
}
</script>
</body>
</html>
